[env:esp32_fisheye]
platform = espressif32@6.4.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../src_esp32_fisheye>
build_flags =
	-I include
	-D CORE_DEBUG_LEVEL=0
